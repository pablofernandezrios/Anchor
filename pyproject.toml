[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-focus"
version = "0.1.0"
description = "Focus and blocking tool for the Linux desktop"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Pablo Fernandez Rios" }]
keywords = ["focus", "productivity", "blocking", "linux", "gnome"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
]
# Root daemons use the standard library only (SPEC 5.4). User-facing components
# depend on distribution packages (PyGObject, GTK4, libadwaita), never on pip.
dependencies = []

[project.urls]
Homepage = "https://github.com/pablofernandezrios/anchor"
Issues = "https://github.com/pablofernandezrios/anchor/issues"

[project.scripts]
anchor = "anchor.cli.main:main"
anchord = "anchor.engine.main:main"
anchor-blockerd = "anchor.blocker.main:main"
anchor-agent = "anchor.agent.main:main"

[project.optional-dependencies]
dev = ["ruff==0.6.9", "mypy==1.11.2", "pytest==8.3.3", "pytest-cov==5.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anchor = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PTH", "RET", "SIM", "ARG", "TID"]
ignore = ["A003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/anchor", "tests"]

[[tool.mypy.overrides]]
module = ["gi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "needs_root: test requires root privileges",
  "needs_systemd: test requires systemd as PID 1",
  "needs_display: test requires a Wayland or X11 session",
]

[tool.coverage.run]
branch = true
source = ["anchor"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
