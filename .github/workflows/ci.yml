name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      - name: mypy (strict)
        run: mypy

  test:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - name: pytest
        run: pytest -m "not needs_root and not needs_systemd and not needs_display" --cov --cov-report=term-missing
      - name: Coverage gate for engine logic
        run: python tools/check_coverage.py

  package:
    name: Build the .deb
    runs-on: ubuntu-24.04
    # Built on every push and kept as an artifact, so that installing Anchor
    # does not start with cloning it. Building is also the only thing that
    # checks the packaging: the first real build found two missing build
    # dependencies, a test step that could not import what it was testing,
    # and a set of links that shipped the source tree inside the package.
    steps:
      - uses: actions/checkout@v4
      - name: Install the Debian build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-setuptools python3-pytest
      - name: Build
        run: sh tools/build_deb.sh "$GITHUB_WORKSPACE/dist"
      - name: Install it, and take it away again
        run: |
          sudo dpkg -i dist/anchor_*.deb
          anchor --version
          test -f /usr/share/anchor/essentials.txt
          test -f /usr/share/applications/org.anchor.Anchor.desktop
          sudo dpkg -r anchor
          test ! -d /usr/share/anchor
      - uses: actions/upload-artifact@v4
        with:
          name: anchor-deb
          path: dist/*.deb

  leaks:
    name: Leak tests on a real machine
    runs-on: ubuntu-24.04
    # These load real firewall rules and redirect real DNS, so they need a
    # virtual machine rather than a container. GitHub's Ubuntu runners are
    # exactly that, which is why SPEC 8.4 can be proved on every push rather
    # than by hand in a VM.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the blocker needs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables systemd-resolved
      - name: Prove a blocked domain cannot be reached (SPEC 8.4)
        run: sudo -E python3 tests/system/leak_test.py "$GITHUB_WORKSPACE/leak-results"
      - name: Confirm the machine was left working
        if: always()
        run: |
          echo "## After the leak tests" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            echo "nftables tables:"; sudo nft list tables || true
            echo "resolution:"; getent hosts github.com || echo "  BROKEN"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leak-results
          path: leak-results/
